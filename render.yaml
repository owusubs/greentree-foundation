services:
  - type: web
    name: greentree-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_SSL
        value: true
      - key: RUN_MIGRATIONS
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: greentree-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: ORG_NOTIFICATION_EMAIL
        sync: false

databases:
  - name: greentree-db
